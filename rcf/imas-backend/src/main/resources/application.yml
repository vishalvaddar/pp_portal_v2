server:
  port: 8080
  shutdown: graceful

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pp_portal_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
  flyway:
    enabled: true
    schemas: pp
    baseline-on-migrate: true
    baseline-version: "1"

imas:
  jwt:
    secret: ${JWT_SECRET:}
    expires-in: ${JWT_EXPIRES_IN:1d}
    pre-auth-expires-in: ${PRE_AUTH_JWT_EXPIRES_IN:15m}
  file-storage-path: ${FILE_STORAGE_PATH:./data}
  event-storage-path: ${EVENT_STORAGE_PATH:./uploads/events}

management:
  endpoints:
    web:
      exposure:
        include: health
